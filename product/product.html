            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #faf8f3;
            color: #333;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: static;
            display: block;
            padding: 12px 16px;
            background: transparent;
            width: 100%;
        }

        .nav-container {
            max-width: 1400px;
            width: calc(100% - 32px);
            margin: 12px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            background: linear-gradient(180deg, #fffefa 0%, #f9fbf6 100%);
            border-radius: 40px;
            padding: 10px 18px;
            box-shadow: 0 12px 30px rgba(27, 45, 53, 0.08);
            border: 1px solid rgba(12, 24, 30, 0.06);
            position: relative;
        }

        .nav-brand {
            font-size: 15px;
            font-weight: 800;
            color: #0f4b53;
            background: #fffde3;
            padding: 10px 18px;
            border-radius: 999px;
            min-width: 180px;
            display: inline-block;
        }

        .nav-links {
            display: flex;
            gap: 18px;
            list-style: none;
            margin: 0;
            padding: 8px 6px;
            align-items: center;
            margin-left: auto;
        }

        .nav-links a {
            color: #114b52;
            text-decoration: none;
            font-size: 13px;
            font-weight: 800;
            padding: 8px 12px;
            border-radius: 999px;
            text-transform: uppercase;
            transition: all .15s;
        }

        .nav-links a:hover {
            background: rgba(16, 82, 88, 0.06);
            transform: translateY(-1px);
        }

        .nav-links a.active {
            background: linear-gradient(90deg, rgba(74, 124, 140, 0.12), rgba(231, 76, 60, 0.04));
            color: #114b52;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            z-index: 1001;
        }

        .menu-toggle span {
            width: 24px;
            height: 2.5px;
            background: #4a7c8c;
            display: block;
            transition: all 0.3s ease;
        }

        .menu-toggle.active span:nth-child(1) {
            transform: rotate(45deg) translate(10px, 10px);
        }

        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-wrap: wrap;
                padding: 12px 15px;
            }

            .nav-brand {
                min-width: auto;
                font-size: 13px;
                padding: 8px 14px;
            }

            .menu-toggle {
                display: flex;
                margin-left: auto;
            }

            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                height: 100vh;
                width: 75%;
                background: linear-gradient(180deg, #faf8f3 0%, #f5f0eb 100%);
                flex-direction: column;
                padding: 80px 30px 30px 30px;
                gap: 20px;
                transition: right 0.3s ease;
                z-index: 1000;
                box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
                margin-left: 0;
                overflow-y: auto;
            }

            .nav-links.active {
                right: 0;
            }

            .nav-links a {
                padding: 14px 16px;
                font-size: 15px;
                border-radius: 8px;
                display: block;
                border-bottom: 1px solid #e0d5c7;
            }

            .nav-links a:last-child {
                border-bottom: none;
            }
        }

        /* ===== SEARCH ===== */
        .search-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px 12px 40px;
            font-size: 16px;
            border: 1px solid #d0c5b9;
            border-radius: 6px;
            background-color: #fff;
            color: #333;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #4a7c8c;
            box-shadow: 0 0 0 3px rgba(74, 124, 140, 0.1);
        }

        .search-box::placeholder {
            color: #999;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            font-size: 18px;
            color: #999;
            pointer-events: none;
        }

        /* ===== PRODUCTS ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 24px;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #e0d5c7;
            border-radius: 8px;
            transition: box-shadow 0.3s ease;
        }

        .product-card:hover {
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

            position: relative;
            width: 100%;
            height: 220px;
            background-color: #f0f0f0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            background-color: #d3d3d3;
            border-radius: 6px;
            object-fit: contain;
            padding: 10px;
        }

        .wishlist-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: rgba(255, 255, 255, 0.95);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            color: #999;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .wishlist-btn:hover {
            color: #e74c3c;
            background-color: #fff;
            transform: scale(1.1);
        }

        .wishlist-btn.active {
            color: #e74c3c;
        }

        .product-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            color: #4a7c8c;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        .product-description {
            font-size: 13px;
            line-height: 1.6;
            color: #666;
            flex-grow: 1;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
        }

        .product-price {

            font-weight: 700;
            color: #4a7c8c;
        }

        .product-price-original {

            color: #999;
            text-decoration: line-through;
            margin-left: 8px;
        }

            font-size: 14px;
        }

        }

        .no-results {

            font-size: 16px;

        }

                description: 'High-capacity 20/32 lithium battery for long-lasting power supply.',
                price: '₹ 200.00',
                originalPrice: '₹ 240.00',
                rating: 4,
                image: '../resources/product20.jpg'
            }
        ];

        const searchInput = document.getElementById('searchInput');
        const productsGrid = document.getElementById('productsGrid');
        const noResults = document.getElementById('noResults');

        function createStars(rating) {
            let stars = '';
            for (let i = 0; i < 5; i++) {
                stars += `<span class="${i < rating ? 'star' : ''}">★</span>`;
            }
            return stars;
        }

        function createProductCard(product) {
            return `
                <div class="product-card" data-product-id="${product.id}">
                    <div class="product-image-container">
                        <img src="${product.image}" alt="${product.name}" class="product-image">
                        <button class="wishlist-btn" onclick="toggleWishlist(event)">♡</button>
                    </div>
                    <div class="product-content">
                        <h3 class="product-title">${product.name}</h3>
                        <p class="product-description">${product.description}</p>
                    </div>
                    <div class="product-footer">
                        <div>
                            <span class="product-price">${product.price}</span>
                            <span class="product-price-original">${product.originalPrice}</span>
                        </div>
                        <div class="rating">
                            ${createStars(product.rating)}
                        </div>
                    </div>
                </div>
            `;
        }

        function filterProducts(searchTerm) {
            const term = searchTerm.toLowerCase().trim();
            const filteredProducts = products.filter(product =>
                product.name.toLowerCase().includes(term) ||
                product.category.toLowerCase().includes(term) ||
                product.description.toLowerCase().includes(term)
            );

            productsGrid.innerHTML = '';

            if (filteredProducts.length === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
                filteredProducts.forEach(product => {
                    productsGrid.innerHTML += createProductCard(product);
                });
            }
        }

        function toggleWishlist(event) {
            event.stopPropagation();
            const btn = event.target;
            btn.classList.toggle('active');
            btn.textContent = btn.classList.contains('active') ? '♥' : '♡';
        }

        searchInput.addEventListener('input', (e) => {
            filterProducts(e.target.value);
        });

        // Initialize with all products
        filterProducts('');

        // Menu toggle
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            navLinks.classList.toggle('active');
        });

        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                navLinks.classList.remove('active');
            });
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.nav-container')) {
                menuToggle.classList.remove('active');
                navLinks.classList.remove('active');
            }
        });
    </script>
</body>

</html>
